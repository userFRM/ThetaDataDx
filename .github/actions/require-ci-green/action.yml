name: Require CI green
description: >-
  Fail unless the CI workflow's verification aggregate concluded success for
  this exact tag. A tag push starts every workflow at once and they cannot see
  each other's jobs, so a publisher that only depends on its own file will
  upload while the core gates are still running, or after they have gone red.

inputs:
  token:
    description: "Token with `actions: read` on this repository."
    required: true
  workflow:
    description: Workflow file holding the job that must have concluded success.
    required: false
    default: ci.yml
  job:
    description: >-
      Name of the job to wait on. Deliberately the verification aggregate and
      not the whole workflow run: the run also contains the publish and release
      jobs, and those finish AFTER crates.io has uploaded. Waiting on the run
      would make a failed release-asset upload block PyPI and npm even though
      every gate passed, which is the split release this exists to prevent.
    required: false
    default: Verified
  timeout-minutes:
    description: How long to wait for that job to conclude before failing.
    required: false
    default: '120'

runs:
  using: composite
  steps:
    - name: Wait for the verification job on this tag
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REQUIRED_WORKFLOW: ${{ inputs.workflow }}
        REQUIRED_JOB: ${{ inputs.job }}
        TIMEOUT_MINUTES: ${{ inputs['timeout-minutes'] }}
      run: |
        set -euo pipefail

        # `gh api` switches to POST as soon as any -f parameter is present, and
        # both of these endpoints are GET-only, so the method is explicit.
        # Filtering and paging are handed to gh's own --jq rather than being
        # reassembled here: concatenated pages are not newline-delimited JSON,
        # and splitting them by hand corrupts any payload whose strings contain
        # brace pairs, such as a commit message.
        # `<id> <status>` of the run this tag started, or nothing yet.
        find_run() {
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${REQUIRED_WORKFLOW}/runs" \
            -f head_sha="${GITHUB_SHA}" \
            -f event=push \
            -f per_page=100 \
            --jq "[.workflow_runs[] | select(.head_branch == \"${GITHUB_REF_NAME}\")] | sort_by(.id) | last | select(. != null) | \"\(.id) \(.status)\""
        }

        # `status conclusion` for the required job, or nothing if it has not
        # appeared in the run yet. per_page rides in the URL because
        # --paginate drives it from there.
        job_state() {
          gh api --method GET --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/$1/jobs?per_page=100" \
            --jq ".jobs[] | select(.name == \"${REQUIRED_JOB}\") | \"\(.status) \(.conclusion // \"none\")\"" \
            | tail -n 1
        }

        deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))

        while :; do
          # The run from the branch push before the tag carries the same commit
          # but not the same lane, since the heavy jobs are forced on a tag and
          # selective off it, so its success is a weaker statement than the one
          # relied on here. Matching the tag name as well as the commit picks
          # the run this tag started.
          found="$(find_run || true)"
          run_id="${found%% *}"
          run_status="${found##* }"

          if [ -z "$found" ]; then
            note="no ${REQUIRED_WORKFLOW} run for tag ${GITHUB_REF_NAME} at ${GITHUB_SHA:0:12} yet"
          else
            state="$(job_state "$run_id" || true)"
            if [ -z "$state" ]; then
              # A finished run that never ran the job is not something more
              # waiting will resolve: a cancelled run reports zero jobs, and
              # waiting the full timeout on it would read as a slow CI rather
              # than a refusal.
              if [ "$run_status" = "completed" ]; then
                echo "::error::refusing to publish: ${REQUIRED_WORKFLOW} run ${run_id} finished without running '${REQUIRED_JOB}'"
                echo "  https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
                exit 1
              fi
              note="${REQUIRED_WORKFLOW} run ${run_id}: job '${REQUIRED_JOB}' has not started"
            else
              status="${state%% *}"
              conclusion="${state##* }"
              note="${REQUIRED_WORKFLOW} run ${run_id}: ${REQUIRED_JOB} is ${status} (${conclusion})"
              if [ "$status" = "completed" ]; then
                echo "$note"
                if [ "$conclusion" = "success" ]; then
                  echo "${REQUIRED_JOB} passed for ${GITHUB_REF_NAME}; publishing may proceed"
                  exit 0
                fi
                echo "::error::refusing to publish: ${REQUIRED_JOB} concluded ${conclusion} for ${GITHUB_REF_NAME}"
                echo "  https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
                exit 1
              fi
            fi
          fi

          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "::error::refusing to publish: timed out after ${TIMEOUT_MINUTES}m waiting for ${REQUIRED_JOB} (${note})"
            exit 1
          fi
          echo "${note}; waiting"
          sleep 30
        done
