name: Require CI green
description: >-
  Fail unless every verification aggregate named below concluded success for
  this exact tag. A tag push starts every workflow at once and none of them can
  see another's jobs, so a publisher that depends only on its own file will
  upload while the other workflows' gates are still running, or after they have
  gone red.

inputs:
  token:
    description: "Token with `actions: read` on this repository."
    required: true
  gates:
    description: >-
      One `workflow-file:job-name` per line. Every one must have concluded
      success before publication proceeds. Each must be a VERIFICATION
      aggregate that excludes its workflow's publish job: a gate that included
      it would be waiting on the caller.
    required: false
    default: |
      ci.yml:Verified
      python.yml:Python verified
      typescript.yml:TypeScript verified
      perf-gate.yml:Perf gate
  timeout-minutes:
    description: How long to wait for all of them to conclude before failing.
    required: false
    default: '120'

runs:
  using: composite
  steps:
    - name: Wait for every verification aggregate on this tag
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REQUIRED_GATES: ${{ inputs.gates }}
        TIMEOUT_MINUTES: ${{ inputs['timeout-minutes'] }}
      run: |
        set -euo pipefail

        # `gh api` switches to POST as soon as any -f parameter is present, and
        # both endpoints are GET-only, so the method is explicit. Filtering and
        # paging go to gh's own --jq: concatenated pages are not newline
        # delimited, and splitting them by hand corrupts any payload whose
        # strings contain a brace pair, such as a commit message.
        api() {
          gh api --method GET "$@"
        }

        # `<id> <status>` of the run this tag started, or nothing yet. The run
        # from the branch push before the tag carries the same commit but not
        # the same lane, since the heavy jobs are forced on a tag and selective
        # off it, so matching the tag name as well picks the right one.
        find_run() {
          api "repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs" \
            -f head_sha="${GITHUB_SHA}" -f event=push -f per_page=100 \
            --jq "[.workflow_runs[] | select(.head_branch == \"${GITHUB_REF_NAME}\")] | sort_by(.id) | last | select(. != null) | \"\(.id) \(.status)\""
        }

        job_state() {
          api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/$1/jobs?per_page=100" \
            --jq ".jobs[] | select(.name == \"$2\") | \"\(.status) \(.conclusion // \"none\")\"" \
            | tail -n 1
        }

        deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
        # A missing token scope makes every call fail. Treating that as "not
        # started yet" would spend the whole timeout and then report a wait,
        # which reads as slow CI rather than as a refusal, so a short run of
        # consecutive failures is tolerated for a transient blip and anything
        # beyond it stops.
        api_failures=0
        MAX_API_FAILURES=3

        mapfile -t gates < <(printf '%s\n' "${REQUIRED_GATES}" | sed '/^[[:space:]]*$/d')
        if [ "${#gates[@]}" -eq 0 ]; then
          echo "::error::no gates configured; refusing to publish against an empty list"
          exit 1
        fi
        echo "waiting on ${#gates[@]} verification aggregates for ${GITHUB_REF_NAME}"

        declare -A passed=()
        while :; do
          pending=0
          for gate in "${gates[@]}"; do
            workflow="${gate%%:*}"
            job="${gate#*:}"
            [ -n "${passed[$gate]:-}" ] && continue

            if ! found="$(find_run "$workflow" 2>&1)"; then
              api_failures=$((api_failures + 1))
              if [ "$api_failures" -gt "$MAX_API_FAILURES" ]; then
                echo "::error::refusing to publish: cannot read ${workflow} runs after ${api_failures} attempts: ${found}"
                exit 1
              fi
              echo "  ${gate}: API read failed (${api_failures}/${MAX_API_FAILURES}), retrying"
              pending=1
              continue
            fi
            api_failures=0

            if [ -z "$found" ]; then
              echo "  ${gate}: no run for this tag yet"
              pending=1
              continue
            fi

            run_id="${found%% *}"
            run_status="${found##* }"
            state="$(job_state "$run_id" "$job")"

            if [ -z "$state" ]; then
              # A finished run that never started the job is not something more
              # waiting resolves: a cancelled run reports no jobs at all.
              if [ "$run_status" = "completed" ]; then
                echo "::error::refusing to publish: ${workflow} run ${run_id} finished without running '${job}'"
                echo "  https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
                exit 1
              fi
              echo "  ${gate}: run ${run_id}, job has not started"
              pending=1
              continue
            fi

            status="${state%% *}"
            conclusion="${state##* }"
            if [ "$status" != "completed" ]; then
              echo "  ${gate}: run ${run_id}, ${status}"
              pending=1
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::refusing to publish: ${job} concluded ${conclusion} in ${workflow} for ${GITHUB_REF_NAME}"
              echo "  https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              exit 1
            fi
            echo "  ${gate}: success"
            passed[$gate]=1
          done

          if [ "$pending" -eq 0 ]; then
            echo "every verification aggregate passed for ${GITHUB_REF_NAME}; publishing may proceed"
            exit 0
          fi
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "::error::refusing to publish: timed out after ${TIMEOUT_MINUTES}m with ${#passed[@]}/${#gates[@]} aggregates passed"
            exit 1
          fi
          sleep 30
        done
