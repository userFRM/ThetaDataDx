version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types: ["patch", "minor"]
    # sonic-rs 0.5.9 and 0.5.10 do not compile: both import `parse_float32`
    # and `parse_number_unchecked` from `sonic_number`, and no published
    # version of that crate exports either. Held at 0.5.8 until a release
    # builds again; a later version is not blocked by this.
    ignore:
      - dependency-name: "sonic-rs"
        versions: ["0.5.9", "0.5.10"]

  - package-ecosystem: "npm"
    directory: "/thetadatadx-ts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types: ["patch", "minor"]
    # The `thetadatadx-*` platform packages in optionalDependencies are this
    # project's own napi binaries; their versions track the release and are
    # set by scripts/release/bump_version.py, not dependabot. Bumping them to
    # an as-yet-unpublished release version breaks the lockfile install.
    ignore:
      - dependency-name: "thetadatadx-*"

  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types: ["patch", "minor"]

  - package-ecosystem: "pip"
    directory: "/thetadatadx-py"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types: ["patch", "minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types: ["patch", "minor"]

