[package]
name = "thetadatadx-mcp-server"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
description = "MCP server for ThetaDataDx, giving LLMs instant access to ThetaData market data"
license.workspace = true
repository.workspace = true

# Binary — not published to crates.io. Only `thetadatadx-rs` is published
# per the publish-crate CI job.
publish = false

[lints]
workspace = true

[[bin]]
name = "thetadatadx-mcp-server"
path = "src/main.rs"

[dependencies]
thetadatadx = { package = "thetadatadx-rs", path = "../../thetadatadx-rs", features = ["__internal"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "io-util", "io-std"] }
serde = { version = "1.0.228", features = ["derive"] }
sonic-rs = "0.5.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.8.2"
