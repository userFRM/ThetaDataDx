[package]
name = "xtask"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Repository maintenance tools: the surface generator, the gRPC snapshot
# refresh and the live latency benchmark. Never published.
publish = false

[lints]
workspace = true

[features]
# Pulls `prost-build` in for `refresh_grpc_snapshot` only, so the other tools
# build without it.
grpc-codegen = ["dep:prost-build"]

[dependencies]
# `__internal` makes the table resolvers' `__paste` re-export reachable.
thetadatadx = { package = "thetadatadx-rs", path = "../thetadatadx-rs", features = ["__internal"] }
heck = "0.5.0"
serde_json = "1.0.137"
# The runtime `bench_latency` drives the streaming client on.
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
prost-build = { version = "=0.14.4", optional = true }

[[bin]]
name = "refresh_grpc_snapshot"
required-features = ["grpc-codegen"]
