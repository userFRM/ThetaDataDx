[package]
name = "thetadatadx-napi"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
description = "TypeScript/Node.js bindings for thetadatadx, the native ThetaData SDK powered by Rust"
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
# npm package only; never publish this napi shim to crates.io.
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
thetadatadx = { package = "thetadatadx-rs", path = "../thetadatadx-rs", features = ["arrow", "__internal"] }

napi = { version = "3.8.5", features = ["async", "serde-json", "napi6"] }
arrow-ipc = "60.0.0"
# RecordBatch / Schema types for the streaming `RecordBatch` reader's Arrow
# IPC boundary. Pinned to the same major as `arrow-ipc` and the parent crate.
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
napi-derive = "3.5.4"

tokio = { version = "1.52.1", features = ["rt-multi-thread"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[build-dependencies]
napi-build = "2.3.1"
