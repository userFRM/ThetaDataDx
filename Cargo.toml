[workspace]
members = [
    "thetadatadx-rs",
    "thetadatadx-ffi",
    "thetadatadx-py",
    "thetadatadx-ts",
    "tools/server",
    "tools/mcp",
    "xtask",
]
resolver = "3"

# Shared package metadata. Member crates inherit individual fields via
# `<field>.workspace = true` so bumping the version, the repo URL, the
# Apache-2.0 license, or the MSRV happens in exactly one place. Every
# member ships at the same version; `scripts/release/bump_version.py`
# moves it together with the npm, CMake and documentation pins.
[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.94"
authors = ["userFRM"]
license = "Apache-2.0"
homepage = "https://github.com/userFRM/ThetaDataDx"
repository = "https://github.com/userFRM/ThetaDataDx"

# Workspace-wide lint configuration. New member crates inherit it once they
# add `[lints] workspace = true`.
#
# Warnings are denied in CI (`RUSTFLAGS=-D warnings` in the workflows and
# `-- -D warnings` on every clippy run), not here. The toolchain floats on
# `stable`, so a manifest-level deny would turn every warning a new rustc
# introduces into a build failure with no code change, for contributors and
# for anyone installing the Python sdist, which carries this manifest and
# compiles the crates as local packages, so the lint levels apply in full.
[workspace.lints.rust]
# `unsafe_op_in_unsafe_fn` forces every unsafe operation inside an
# `unsafe fn` body to be wrapped in its own `unsafe { ... }` block. This
# is the lang-team-recommended hygiene and matches our FFI boundary
# discipline (see `thetadatadx-ffi/src/lib.rs`).
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Deny the default clippy set — same bar as `cargo clippy -- -D warnings`
# but expressed declaratively so it applies to every member crate, every
# target (lib, bins, tests, benches, examples), without needing the flag
# on the command line.
all = { level = "deny", priority = -1 }
# Every `unsafe { ... }` block requires a `// SAFETY:` comment that
# explains why the unsafe operation is sound (pointer provenance,
# lifetime invariant, alignment, exclusive access, etc.). The FFI
# boundary inherits raw-pointer args from the C ABI; without this
# lint a maintainer could add a new `unsafe { *handle }` without
# documenting the caller-side guarantees the boundary requires.
undocumented_unsafe_blocks = "deny"
