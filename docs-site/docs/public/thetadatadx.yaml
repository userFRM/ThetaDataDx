            interest_rate = client.market_data.interest_rate_history_eod("SOFR", "20250303", "20250303")
        - lang: cpp
          label: C++
          source: |
            auto interest_rate = client.market_data().interest_rate_history_eod("SOFR", "20250303", "20250303");

  # =========================================================================
  # TERMINAL SYSTEM
  # =========================================================================
  # Mirrored 1:1 from the JVM terminal this server replaces: three
  # unauthenticated GET routes with bare `text/plain` bodies, so operator
  # tooling written against the terminal's mgmt surface works unchanged.

  /v3/terminal/shutdown:
    get:
      operationId: terminalShutdown
      tags: [Terminal]
      summary: Shut down the server
      description: |
        Kills the server process, matching the JVM terminal. Unauthenticated;
        returns the plain-text body `OK`.
      parameters: []
      responses:
        '200':
          description: Shutdown initiated.
          content:
            text/plain:
              schema:
                type: string
                enum: [OK]

  /v3/terminal/fpss/status:
    get:
      operationId: terminalStreamingStatus
      tags: [Terminal]
      summary: Streaming channel status (text/plain)
      description: |
        Streaming channel health as the terminal's one-word `text/plain`
        body.
      parameters: []
      responses:
        '200':
          description: Streaming channel state as a one-word plain-text body.
          content:
            text/plain:
              schema:
                type: string
                enum: [CONNECTED, DISCONNECTED]

  /v3/terminal/mdds/status:
    get:
      operationId: terminalMarketDataStatus
      tags: [Terminal]
      summary: Market-data channel status (text/plain)
      description: |
        Market-data channel health as the terminal's one-word `text/plain`
        body.
      parameters: []
      responses:
        '200':
          description: Market-data channel state as a one-word plain-text body.
          content:
            text/plain:
              schema:
                type: string
                enum: [CONNECTED, DISCONNECTED]


  # =========================================================================
  # FLAT FILES
  # =========================================================================

  /v3/{sec_type}/flat_file/{req_type}:
    get:
      operationId: flatfileGetBySecType
      tags: [Flat Files]
      summary: Download a daily flat file (sec_type/flat_file/req_type path form)
      description: |
        The terminal's flat-file path form: the security type leads the path
        and `flat_file` separates it from the request type. The `sec_type` and
        `req_type` segments are matched case-insensitively. The response body
        is the file bytes, streamed as an attachment. Only these pairs are
        served (any other pairing returns 400):
        `option/trade_quote`, `option/open_interest`, `option/eod`,
        `stock/trade_quote`, `stock/eod`. The path form takes the
        parameters independently, so an unserved pairing (for example
        `stock/open_interest`) is accepted by the route but rejected at request
        time with 400.
      parameters:
        - name: sec_type
          in: path
          required: true
          schema:
            type: string
            enum: [option, stock]
          description: Security type (case-insensitive).
        - name: req_type
          in: path
          required: true
          schema:
            type: string
            enum: [trade_quote, open_interest, eod]
          description: |
            Request type (case-insensitive). `open_interest` is served for
            `option` only.
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Trading date in YYYY-MM-DD or YYYYMMDD format.
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json, ndjson, jsonl, html]
            default: csv
          description: |
            On-disk format. Defaults to csv. `json` streams a single JSON
            array; `ndjson` (alias `jsonl`) newline-delimited JSON; `html` an
            HTML table.
      responses:
        '200':
          description: |
            Flat-file bytes streamed as an attachment. Content type is
            `text/csv` for csv, `application/json` for json,
            `application/x-ndjson` for ndjson / jsonl, or `text/html` for html.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
            application/x-ndjson:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                format: binary
        '400':
          description: Unknown security type, request type, format, or date, or an unserved pair.
        '502':
          description: The flat-file distribution is unavailable upstream.

# ---------------------------------------------------------------------------
# COMPONENTS
# ---------------------------------------------------------------------------
components:

  schemas:
    Row: *row

    ContractSpec:
      type: object
      description: Option contract specification
      required: [symbol, expiration]
      properties:
        symbol:
          type: string
          description: Underlying symbol (e.g. "SPY")
        expiration:
          type: string
          description: Expiration date in YYYYMMDD or YYYY-MM-DD format
        strike:
          type: string
          description: Strike price in dollars as a string
        right:
          type: string
          enum: [C, P]
          description: '"C" for call, "P" for put'

    Price:
      type: number
      format: double
      description: All prices are decoded to f64 (double) during parsing.

    StreamEventKind:
      type: string
      description: |
        Discriminator for streaming event variants. This is a literal-union
        string, not a TypeScript `const enum`, so the type information
        stays self-contained under `isolatedModules: true` and works
        in every toolchain (Vite, esbuild, ts-jest, Next.js).
      enum:
        - ohlcvc
        - open_interest
        - quote
        - trade
        - simple
        - raw_data

    StreamEvent:
      type: object
      description: Real-time streaming event
      oneOf:
        - type: object
          description: Quote tick (best bid/ask update)
          properties:
            kind:
              type: string
              enum: [quote]
            contract_id:
              type: integer
            ms_of_day:
              type: integer
            bid:
              type: number
              format: double
            ask:
              type: number
              format: double
            bid_size:
              type: integer
            ask_size:
              type: integer
            bid_exchange:
              type: integer
            ask_exchange:
              type: integer
            date:
              type: integer
            received_at_ns:
              type: integer
              format: int64
              description: Nanosecond monotonic receipt timestamp
        - type: object
          description: Trade tick
          properties:
            kind:
              type: string
              enum: [trade]
            contract_id:
              type: integer
            ms_of_day:
              type: integer
            sequence:
              type: integer
            price:
              type: number
              format: double
            size:
              type: integer
            exchange:
              type: integer
            condition:
              type: integer
            date:
              type: integer
            received_at_ns:
              type: integer
              format: int64
              description: Nanosecond monotonic receipt timestamp
        - type: object
          description: Open interest tick
          properties:
            kind:
              type: string
              enum: [open_interest]
            contract_id:
              type: integer
            ms_of_day:
              type: integer
            open_interest:
              type: integer
            date:
              type: integer
            received_at_ns:
              type: integer
              format: int64
              description: Nanosecond monotonic receipt timestamp
        - type: object
          description: |
            OHLCVC bar (open/high/low/close + volume + count).
            Volume and count are `i64`.
          properties:
            kind:
              type: string
              enum: [ohlcvc]
            contract_id:
              type: integer
            ms_of_day:
              type: integer
            open:
              type: number
              format: double
            high:
              type: number
              format: double
            low:
              type: number
              format: double
            close:
              type: number
              format: double
            volume:
              type: integer
              format: int64
            count:
              type: integer
              format: int64
            date:
              type: integer
            received_at_ns:
              type: integer
              format: int64
              description: Nanosecond monotonic receipt timestamp
        - type: object
          description: |
            Control / diagnostic event (streaming lifecycle). SDKs flatten
            every `StreamControl` variant into a single `Simple` pyclass / TS
            object with `kind: "simple"` and an `event_type` discriminator.
            Use `event_type` to branch on the concrete variant; `detail` is
            a free-form diagnostic string; `id` is the contract_id / req_id
            / reconnect-attempt number where applicable.
          properties:
            kind:
              type: string
              enum: [simple]
              description: Top-level variant discriminator — always "simple" for control events.
            event_type:
              type: string
              enum:
                - login_success
                - contract_assigned
                - req_response
                - market_open
                - market_close
                - server_error
                - disconnected
                - reconnecting
                - reconnected
                - error
                - unknown_frame
                - unknown_event
              description: Concrete control-event name.
            detail:
              type: string
              nullable: true
              description: Free-form diagnostic payload; `null` for variants with no payload.
            id:
              type: integer
              format: int32
              nullable: true
              description: contract_id / req_id / reconnect attempt number (variant-specific).
            received_at_ns:
              type: integer
              format: int64
              description: Nanosecond monotonic receipt timestamp
        - type: object
          description: |
            Raw (non-decoded) streaming payload. `payload` is a base64-encoded
            copy of the original bytes (escape-hatch for forward-compat /
            debugging; SDKs should prefer decoded variants above).
          properties:
            kind:
              type: string
              enum: [raw_data]
            code:
              type: integer
              format: int32
              minimum: 0
              maximum: 255
              description: Wire byte code (0-255). Original streaming protocol uses unsigned 8-bit.
            payload:
              type: string
              description: Base64-encoded raw bytes
            received_at_ns:
              type: integer
              format: int64
              description: Nanosecond monotonic receipt timestamp

    Error:
      type: object
      description: |
        The JSON body of the failures the server answers with an envelope: a
        query string it cannot accept, any failure on the flat-file routes, and
        an internal fault while rendering a response. `error_type` is the
        discriminator a client branches on; see the error codes page for the
        values. Every other failed request is answered with an HTTP status and
        a plain-text description.
      required: [header, response]
      properties:
        header:
          type: object
          properties:
            error_type:
              type: string
            error_msg:
              type: string
        response:
          type: array
          maxItems: 0

  parameters:
    symbol:
      <<: *symbol-param
    symbols:
      <<: *symbols-param
    start_date:
      <<: *start_date-param
    end_date:
      <<: *end_date-param
    date:
      <<: *date-param
    interval:
      <<: *interval-param
    time_of_day:
      <<: *time_of_day-param
    venue:
      <<: *venue-param
    min_time:
      <<: *min_time-param
    request_type:
      <<: *request_type-param
    expiration:
      <<: *expiration-param
    strike:
      <<: *strike-param
    right:
      <<: *right-param
    max_dte:
      <<: *max_dte-param
    strike_range:
      <<: *strike_range-param
