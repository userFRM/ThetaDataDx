openapi: 3.1.0

info:
  title: ThetaDataDx SDK
  description: |
    Canonical checked-in REST contract for the registry endpoints exposed by
    ThetaDataDx's server surface. SDK-only callback-based `*_stream` history
    builders are documented in the API reference rather than this OpenAPI file.

    ThetaDataDx also ships native Rust, Python (PyO3), and C++
    bindings backed by the same Rust core.

    Date parameters take YYYYMMDD (ISO YYYY-MM-DD is also accepted) and
    time-of-day parameters take Eastern Time HH:MM:SS. Responses render dates
    as ISO YYYY-MM-DD and times as ISO local date-times in Eastern Time.
    Intervals are one of the presets: tick, 10ms, 100ms, 500ms, 1s, 5s, 10s, 15s, 30s, 1m, 5m, 10m, 15m, 30m, 1h.
    All prices are f64 (double) -- decoded during parsing.
  version: 0.5.1
  contact:
    name: ThetaDataDx
    url: https://github.com/userFRM/ThetaDataDx
  license:
    name: Apache-2.0
    url: https://github.com/userFRM/ThetaDataDx/blob/main/LICENSE

servers:
  - url: http://localhost:25503
    description: Local ThetaDataDx server (HTTP)

tags:
  - name: Stock / List
    description: Enumerate available stock symbols and dates
  - name: Stock / Snapshot
    description: Real-time stock snapshots (OHLC, trade, quote, market value)
  - name: Stock / History
    description: Historical stock data (EOD, intraday OHLC, trades, quotes)
  - name: Stock / AtTime
    description: Stock data at a specific time of day across a date range
  - name: Option / List
    description: Enumerate option symbols, dates, expirations, strikes, and contracts
  - name: Option / Snapshot
    description: Real-time option snapshots (OHLC, trade, quote, OI, market value)
  - name: Option / Snapshot Greeks
    description: Real-time option Greeks snapshots (IV, all, first/second/third order)
  - name: Option / History
    description: Historical option data (EOD, intraday OHLC, trades, quotes, OI)
  - name: Option / History Greeks
    description: Historical option Greeks (EOD, intraday, IV, first/second/third order)
  - name: Option / History Trade Greeks
    description: Greeks computed on each individual option trade
  - name: Option / AtTime
    description: Option data at a specific time of day across a date range
  - name: Index / List
    description: Enumerate available index symbols and dates
  - name: Index / Snapshot
    description: Real-time index snapshots (OHLC, price, market value)
  - name: Index / History
    description: Historical index data (EOD, intraday OHLC, price)
  - name: Index / AtTime
    description: Index data at a specific time of day across a date range
  - name: Calendar
    description: Market calendar operations (open today, date info, yearly calendar)
  - name: Interest Rate
    description: Interest rate data endpoints
  - name: System
    description: Server status and lifecycle endpoints
  - name: Flat Files
    description: Whole-universe daily flat-file downloads (CSV or JSON Lines)

# No security requirement: the server authenticates its upstream connection
# once at startup, and request paths carry no per-request credential — matching
# the terminal, whose local routes (including shutdown) are all unauthenticated.

# ---------------------------------------------------------------------------
# Reusable anchors for common parameter/schema objects
# ---------------------------------------------------------------------------
x-anchors:
  # --- Common parameter shapes ---
  symbol-param: &symbol-param
    name: symbol
    in: query
    required: true
    schema:
      type: string
    description: Ticker symbol (e.g. "AAPL")

  symbol-optional-param: &symbol-optional-param
    name: symbol
    in: query
    required: false
    schema:
      type: string
    description: >-
      Ticker symbol to filter by (e.g. "AAPL"), or a comma-separated list
      ("AAPL,SPY") for the contracts of each. Omit it to list every contract
      for the date.

  symbols-param: &symbols-param
    name: symbol
    in: query
    required: true
    schema:
      type: array
      items:
        type: string
    description: One or more ticker symbols

  start_date-param: &start_date-param
    name: start_date
    in: query
    required: true
    schema:
      type: string
      pattern: '^(\d{8}|\d{4}-\d{2}-\d{2})$'
    description: Start date in YYYYMMDD or YYYY-MM-DD format

  end_date-param: &end_date-param
    name: end_date
    in: query
    required: true
    schema:
      type: string
      pattern: '^(\d{8}|\d{4}-\d{2}-\d{2})$'
    description: End date in YYYYMMDD or YYYY-MM-DD format

  date-param: &date-param
    name: date
    in: query
    required: true
    schema:
      type: string
      pattern: '^(\d{8}|\d{4}-\d{2}-\d{2})$'
    description: Date in YYYYMMDD or YYYY-MM-DD format

  date-optional-param: &date-optional-param
    name: date
    in: query
    required: false
    schema:
      type: string
      pattern: '^(\d{8}|\d{4}-\d{2}-\d{2})$'
    description: Date in YYYYMMDD or YYYY-MM-DD format (optional when using start_date/end_date)

  start_date-optional-param: &start_date-optional-param
    name: start_date
    in: query
    required: false
    schema:
      type: string
      pattern: '^(\d{8}|\d{4}-\d{2}-\d{2})$'
    description: Range start date in YYYYMMDD or YYYY-MM-DD format (optional; pair with end_date instead of date)

  end_date-optional-param: &end_date-optional-param
    name: end_date
    in: query
    required: false
    schema:
      type: string
      pattern: '^(\d{8}|\d{4}-\d{2}-\d{2})$'
    description: Range end date in YYYYMMDD or YYYY-MM-DD format (optional; pair with start_date instead of date)

  format-param: &format-param
    name: format
    in: query
    required: false
    schema:
      type: string
      enum: [csv, json, json_new, json_legacy, ndjson, jsonl, html]
      default: csv
    description: 'Response representation. Defaults to csv; `json_new` is an alias of `json`, and `jsonl` of `ndjson`.'

  interval-param: &interval-param
    name: interval
    in: query
    required: false
    schema:
      type: string
      enum: [tick, 10ms, 100ms, 500ms, 1s, 5s, 10s, 15s, 30s, 1m, 5m, 10m, 15m, 30m, 1h]
      default: 1s
    description: >-
      Aggregation interval. One of the presets in the enum; omitting it
      samples at 1s. Intervals under 1m are available on single-day requests
      only.

  time_of_day-param: &time_of_day-param
    name: time_of_day
    in: query
    required: true
    schema:
      type: string
    description: ET wall-clock time in HH:MM:SS.SSS (e.g. "09:30:00.000" for 9:30 AM ET; legacy "34200000" is also accepted)

  venue-param: &venue-param
    name: venue
    in: query
    required: false
    schema:
      type: string
      enum: [nqb, utp_cta]
      default: nqb
    description: >-
      Data venue: `nqb` is Nasdaq Basic, `utp_cta` the merged UTP and CTA
      feeds. Omitting it reads Nasdaq Basic.

  min_time-param: &min_time-param
    name: min_time
    in: query
    required: false
    schema:
      type: string
    description: Minimum timestamp filter

  start_time-param: &start_time-param
    name: start_time
    in: query
    required: false
    schema:
      type: string
      default: '09:30:00'
    description: Start of the time-of-day window, inclusive, Eastern Time HH:MM:SS

  end_time-param: &end_time-param
    name: end_time
    in: query
    required: false
    schema:
      type: string
      default: '16:00:00'
    description: End of the time-of-day window, inclusive, Eastern Time HH:MM:SS

  request_type-param: &request_type-param
    name: request_type
    in: query
    required: true
    schema:
      type: string
      enum: [trade, quote, eod, ohlc, TRADE, QUOTE, EOD, OHLC]
    description: >-
      The type of data request, in the upstream lower-case vocabulary or the
      equivalent upper-case spelling.

  request_type-path-param: &request_type-path-param
    name: request_type
    in: path
    required: true
    schema:
      type: string
      enum: [trade, quote, eod, ohlc, TRADE, QUOTE, EOD, OHLC]
    description: >-
      The type of data request, in the upstream lower-case vocabulary or the
      equivalent upper-case spelling.

  expiration-param: &expiration-param
    name: expiration
    in: query
    required: true
    schema:
      type: string
      pattern: '^(\d{8}|\d{4}-\d{2}-\d{2}|\*)$'
    description: >-
      Option expiration date in YYYYMMDD or YYYY-MM-DD format. Pass `*` to select all
      expirations for the underlying (chain-wide; query one date at a time).

  expiration-no-star-param: &expiration-no-star-param
    name: expiration
    in: query
    required: true
    schema:
      type: string
      pattern: '^(\d{8}|\d{4}-\d{2}-\d{2})$'
    description: >-
      Option expiration date in YYYYMMDD or YYYY-MM-DD format. This endpoint resolves a
      single concrete expiration and rejects the `*` wildcard.

  strike-param: &strike-param
    name: strike
    in: query
    required: false
    schema:
      type: string
      default: '*'
    description: >-
      Strike price in dollars as a string (e.g. "500" or "17.5"). Omit it to
      select every strike on the expiration, the same as passing `*`.

  right-param: &right-param
    name: right
    in: query
    required: false
    schema:
      type: string
      enum: [call, put, both, C, P, c, p, CALL, PUT, Call, Put, "*"]
      default: both
    description: >-
      Option side. Use `both` or `*` (alias) for calls and puts. Accepts
      `call`, `put`, `both` (upstream ThetaData vocabulary), plus our
      short-forms `C` (call), `P` (put), and `*` (alias for `both`) for SDK
      ergonomics. Matching is case-insensitive. Every endpoint that exposes
      `right` accepts the `both` / `*` wildcard, and omitting the parameter
      returns both sides.

  max_dte-param: &max_dte-param
    name: max_dte
    in: query
    required: false
    schema:
      type: integer
    description: Maximum days to expiration filter

  strike_range-param: &strike_range-param
    name: strike_range
    in: query
    required: false
    schema:
      type: integer
    description: Number of strikes above/below ATM to include

  exclusive-param: &exclusive-param
    name: exclusive
    in: query
    required: false
    schema:
      type: boolean
      default: true
    description: >-
      When true, a quote whose timestamp equals the trade timestamp is
      excluded and only quotes strictly before the trade are paired with it.

  # --- Greeks optional parameters ---
  annual_dividend-param: &annual_dividend-param
    name: annual_dividend
    in: query
    required: false
    schema:
      type: number
      format: double
    description: Annual dividend amount for Greeks calculation

  rate_type-param: &rate_type-param
    name: rate_type
    in: query
    required: false
    schema:
      type: string
      enum: [sofr, treasury_m1, treasury_m3, treasury_m6, treasury_y1, treasury_y2, treasury_y3, treasury_y5, treasury_y7, treasury_y10, treasury_y20, treasury_y30]
      default: sofr
    description: Risk-free-rate source used in the Greeks calculation

  rate_value-param: &rate_value-param
    name: rate_value
    in: query
    required: false
    schema:
      type: number
      format: double
    description: Interest rate value for Greeks calculation

  stock_price-param: &stock_price-param
    name: stock_price
    in: query
    required: false
    schema:
      type: number
      format: double
    description: Override underlying stock price for Greeks calculation

  greeks_version-param: &greeks_version-param
    name: version
    in: query
    required: false
    schema:
      type: string
      enum: [latest, '1']
      default: latest
    description: >-
      Greeks model version. `1` holds the time to expiration at 0.15 days for
      a 0DTE contract; `latest` uses the real time to expiration, down to a
      floor of one hour.

  binomial_steps-param: &binomial_steps-param
    name: binomial_steps
    in: query
    required: false
    schema:
      type: integer
      format: int32
      minimum: 5
      maximum: 201
      default: 101
    description: >-
      Steps in the binomial tree used for the Greeks calculation. An even value
      is rounded up to the next odd one, and a request for every expiration is
      capped at 101 steps.

  perf_boost_intraday-param: &perf_boost_intraday-param
    name: perf_boost_intraday
    in: query
    required: false
    schema:
      type: boolean
      default: false
    description: >-
      When true, the underlying price for a current-day query is looked up with
      1-second precision instead of millisecond precision, which answers faster.

  use_market_value-param: &use_market_value-param
    name: use_market_value
    in: query
    required: false
    schema:
      type: boolean
      default: false
    description: >-
      When true, calculate the Greeks against the option market value
      (mid-price) instead of the NBBO bid/ask pair.

  underlyer_use_nbbo-param: &underlyer_use_nbbo-param
    name: underlyer_use_nbbo
    in: query
    required: false
    schema:
      type: boolean
      default: false
    description: >-
      When true, the underlyer price fed to the Greeks calculation is the
      midpoint of its NBBO; when false it is the last trade price.

  # --- Response shape ---
  # Every registry route answers in the same envelope; only the columns of a
  # row differ. Each route's reference page lists its columns in order, and a
  # row carries only the columns the upstream response carried, so the columns
  # are not modelled per route here.
  row: &row
    type: object
    description: |
      One record, keyed by column name. The columns and their order are those
      listed on the route's reference page. Times are ISO local date-times in
      US Eastern time under `timestamp` (`2024-01-02T09:30:00.000`), dates are
      ISO `YYYY-MM-DD` strings, an option right is `CALL` or `PUT`, and a
      condition or exchange cell the upstream left empty is `null`.
    additionalProperties: true

  v3-response: &v3-response
    description: |
      Successful response, in the representation the `format` parameter
      selects. Without `format` the body is CSV with a header row. With
      `format=json` it is the envelope below: `response` holds the rows, except
      on option market-data routes, where it holds one
      `{"contract": {symbol, expiration, strike, right}, "data": [row, ...]}`
      block per contract, in the order the contracts arrived. `ndjson` / `jsonl`
      writes one row object per line with the contract columns inline, `html`
      a table, and `json_legacy` one array per column, keyed by column name.
    content:
      text/csv:
        schema:
          type: string
      application/json:
        schema:
          anyOf:
            - description: '`format=json` / `json_new`: the rows inside the `response` envelope.'
              type: object
              required: [response]
              properties:
                response:
                  type: array
                  items:
                    oneOf:
                      - *row
                      - type: object
                        required: [contract, data]
                        properties:
                          contract:
                            type: object
                            properties:
                              symbol:
                                type: string
                              expiration:
                                type: string
                                description: ISO `YYYY-MM-DD` date
                              strike:
                                type: number
                                format: double
                                description: Strike in dollars
                              right:
                                type: string
                                enum: [CALL, PUT]
                          data:
                            type: array
                            items: *row
            - description: '`format=json_legacy`: no envelope; one array per column, keyed by column name, where index `i` of every array is row `i`.'
              type: object
              additionalProperties:
                type: array
      application/x-ndjson:
        schema:
          type: string
      text/html:
        schema:
          type: string

# ---------------------------------------------------------------------------
# PATHS
# ---------------------------------------------------------------------------
paths:

  # =========================================================================
  # STOCK / LIST
  # =========================================================================

  /v3/stock/list/symbols:
    x-min-subscription: free
    get:
      operationId: stockListSymbols
      summary: List all stock symbols
      description: |
        Returns all traded stock symbols. Updated overnight.
        gRPC: GetStockListSymbols
      tags: [Stock / List]
      parameters:
        - *format-param
      responses:
        '200': *v3-response
      x-code-examples:
        - lang: rust
          label: Rust
          source: |
            let symbols = client.market_data().stock_list_symbols().await?;
        - lang: python
          label: Python
          source: |
            symbols = client.market_data.stock_list_symbols()
        - lang: cpp
          label: C++
          source: |
            auto symbols = client.market_data().stock_list_symbols();

  /v3/stock/list/dates:
    x-min-subscription: free
    get:
      operationId: stockListDates
      summary: List available dates for a stock
      description: |
        Lists all dates of data available for a stock by request type (EOD, TRADE, QUOTE, etc.).
        Updated overnight.
        gRPC: GetStockListDates
      tags: [Stock / List]
      parameters:
        - *request_type-param
        - *symbol-param
        - *format-param
      responses:
        '200': *v3-response
      x-code-examples:
        - lang: rust
          label: Rust
          source: |
            let dates = client.market_data().stock_list_dates("TRADE", "AAPL").await?;
        - lang: python
          label: Python
          source: |
            dates = client.market_data.stock_list_dates("TRADE", "AAPL")
        - lang: cpp
          label: C++
          source: |
            auto dates = client.market_data().stock_list_dates("TRADE", "AAPL");

  /v3/stock/list/dates/{request_type}:
    x-min-subscription: free
    get:
      operationId: stockListDatesByRequestType
      summary: List available dates for a stock (path form)
      description: |
        Path-segment form of `/v3/stock/list/dates`: the request type rides the
        URL path instead of a query parameter. Same endpoint and response; this
        is the terminal-compatible `/v3/stock/list/dates/{request_type}` spelling.
        gRPC: GetStockListDates
      tags: [Stock / List]
      parameters:
        - *request_type-path-param
        - *symbol-param
        - *format-param
      responses:
        '200': *v3-response
      x-code-examples:
        - lang: rust
          label: Rust
          source: |
            let dates = client.market_data().stock_list_dates("TRADE", "AAPL").await?;
        - lang: python
          label: Python
          source: |
            dates = client.market_data.stock_list_dates("TRADE", "AAPL")
        - lang: cpp
          label: C++
          source: |
            auto dates = client.market_data().stock_list_dates("TRADE", "AAPL");

  # =========================================================================
  # STOCK / SNAPSHOT
  # =========================================================================

  /v3/stock/snapshot/ohlc:
    x-min-subscription: value
    get:
      operationId: stockSnapshotOhlc
      summary: Stock OHLC snapshot
      description: |
        Real-time Open, High, Low, Close for the current trading day.
        Returns real-time data with standard/pro subscription, 15-minute delayed with value subscription.
        Snapshot cache resets at midnight ET daily.
        gRPC: GetStockSnapshotOhlc
      tags: [Stock / Snapshot]
      parameters:
        - *symbols-param
        - *venue-param
        - *min_time-param
        - *format-param
      responses:
        '200': *v3-response
      x-code-examples:
        - lang: rust
          label: Rust
          source: |
            let ohlc = client.market_data().stock_snapshot_ohlc(&["AAPL"]).await?;
        - lang: python
          label: Python
          source: |
            ohlc = client.market_data.stock_snapshot_ohlc(["AAPL"])
        - lang: cpp
          label: C++
          source: |
            auto ohlc = client.market_data().stock_snapshot_ohlc({"AAPL"});

  /v3/stock/snapshot/trade:
    x-min-subscription: standard
    get:
      operationId: stockSnapshotTrade
      summary: Stock trade snapshot
      description: |
        Real-time last trade from the Nasdaq Basic feed.
        Requires stocks standard or pro subscription.
        Snapshot cache resets at midnight ET daily.
        gRPC: GetStockSnapshotTrade
      tags: [Stock / Snapshot]
      parameters:
        - *symbols-param
        - *venue-param
        - *min_time-param
        - *format-param
      responses:
        '200': *v3-response
      x-code-examples:
        - lang: rust
          label: Rust
          source: |
            let trade = client.market_data().stock_snapshot_trade(&["AAPL"]).await?;
        - lang: python
          label: Python
          source: |
            trade = client.market_data.stock_snapshot_trade(["AAPL"])
        - lang: cpp
          label: C++
          source: |
            auto trade = client.market_data().stock_snapshot_trade({"AAPL"});

  /v3/stock/snapshot/quote:
    x-min-subscription: value
    get:
      operationId: stockSnapshotQuote
      summary: Stock quote snapshot
      description: |
        Real-time last BBO quote from the Nasdaq Basic feed (standard/pro) or
        15-minute delayed NBBO quote from UTP/CTA feeds (value subscription).
        Snapshot cache resets at midnight ET daily.
        gRPC: GetStockSnapshotQuote
      tags: [Stock / Snapshot]
      parameters:
        - *symbols-param
        - *venue-param
        - *min_time-param
        - *format-param
      responses:
        '200': *v3-response
      x-code-examples:
        - lang: rust
          label: Rust
          source: |
            let quote = client.market_data().stock_snapshot_quote(&["AAPL"]).await?;
        - lang: python
          label: Python
          source: |
            quote = client.market_data.stock_snapshot_quote(["AAPL"])
        - lang: cpp
          label: C++
          source: |
            auto quote = client.market_data().stock_snapshot_quote({"AAPL"});

  /v3/stock/snapshot/market_value:
    x-min-subscription: standard
    get:
      operationId: stockSnapshotMarketValue
      summary: Stock market value snapshot
      description: |
        Latest market value snapshot for one or more stocks.
        gRPC: GetStockSnapshotMarketValue
      tags: [Stock / Snapshot]
      parameters:
        - *symbols-param
        - *venue-param
        - *min_time-param
        - *format-param
      responses:
        '200': *v3-response
      x-code-examples:
        - lang: rust
          label: Rust
          source: |
            let market_value = client.market_data().stock_snapshot_market_value(&["AAPL"]).await?;
        - lang: python
          label: Python
          source: |
            market_value = client.market_data.stock_snapshot_market_value(["AAPL"])
        - lang: cpp
          label: C++
          source: |
            auto market_value = client.market_data().stock_snapshot_market_value({"AAPL"});

  # =========================================================================
  # STOCK / HISTORY
  # =========================================================================

  /v3/stock/history/eod:
    x-min-subscription: free
    get:
      operationId: stockHistoryEod
      summary: Stock end-of-day history
      description: |
        End-of-day stock data for a date range including OHLC + closing quote.
        gRPC: GetStockHistoryEod
      tags: [Stock / History]
      parameters:
        - *symbol-param
        - *start_date-param
        - *end_date-param
        - *format-param
      responses:
        '200': *v3-response
      x-code-examples:
        - lang: rust
          label: Rust
          source: |
            let eod = client.market_data().stock_history_eod("AAPL", "20250303", "20250303").await?;
        - lang: python
          label: Python
          source: |
            eod = client.market_data.stock_history_eod("AAPL", "20250303", "20250303")
        - lang: cpp
          label: C++
          source: |
            auto eod = client.market_data().stock_history_eod("AAPL", "20250303", "20250303");

  /v3/stock/history/ohlc:
    x-min-subscription: value
    get:
      operationId: stockHistoryOhlc
      summary: Stock intraday OHLC bars
      description: |
        Intraday OHLC bars. Supply `date` for a single day, or `start_date`/`end_date` for a date range on the same route.
        Interval is one of the presets: tick, 10ms, 100ms, 500ms, 1s, 5s, 10s, 15s, 30s, 1m, 5m, 10m, 15m, 30m, 1h.
        gRPC: GetStockHistoryOhlc
      tags: [Stock / History]
      parameters:
        - *symbol-param
        - *date-optional-param
        - *start_date-optional-param
        - *end_date-optional-param
        - *interval-param
        - *start_time-param
        - *end_time-param
        - *venue-param
        - *format-param
      responses:
        '200': *v3-response
      x-code-examples:
        - lang: rust
          label: Rust
          source: |
            let ohlc = client.market_data().stock_history_ohlc("AAPL").interval("1m").await?;
        - lang: python
          label: Python
          source: |
