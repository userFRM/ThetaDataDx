# Source-of-truth for the vendor vocabulary tables. Compiled into
# `thetadatadx-rs/src/tdbe/vocabulary/tables_generated.rs` by
# `build_support/vocabulary.rs`.
#
# These are the vendor's own names for the things its protocol addresses:
# the columns a response can carry, the request families it serves, the
# arguments those requests take, the output formats, the account tiers and
# the calendar query kinds. Most already appear in this SDK's published
# reference pages; the tables collect them so a caller can check a name
# against the vendor's vocabulary rather than against this SDK's spelling.
#
# The SDK does not send most of these. It addresses the typed gRPC surface,
# where the request family and its arguments are the method and its message
# fields. They are carried as reference vocabulary, not as a wire surface.

[[vocabulary]]
name = "AccountType"
names = [
    "FREE", "VALUE", "STANDARD", "PRO",
]

